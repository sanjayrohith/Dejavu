name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    # worktree.ts and anchors.ts shell out to git and read .git/HEAD
    # directly — exactly the code most likely to behave differently per
    # platform. Linux and macOS only for now: both are POSIX, and this
    # matrix has never run before, so nothing here is actually verified
    # against Windows yet. Add windows-latest as its own change once
    # someone has looked at what breaks, rather than folding an unverified
    # platform into what was otherwise a zero-risk restoration.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Tests, types, and benchmark evidence
        run: bun run check
      - name: Shared Worker unit tests
        # Not covered by `bun run check` — that only runs ./test, and
        # shared-server is its own package with its own test directory.
        run: bun test shared-server/test/worker.unit.test.ts
      - name: Verify publish contents
        run: |
          mkdir -p /tmp/dejavu-pack
          bun pm pack --destination /tmp/dejavu-pack
          test -f /tmp/dejavu-pack/dejavu-0.1.0.tgz
